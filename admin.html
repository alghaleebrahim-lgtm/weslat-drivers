<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة السائقين – وصلت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--blue:#002EB0;--blue-dark:#00218A;--yellow:#FFBA08;--ink:#0F1B3D;--muted:#5B6585;--line:#E1E6F0;--bg:#F3F5FB;--green:#1B8A4B;--red:#C62828;--orange:#C77700}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit}
  [hidden]{display:none!important}

  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(15,27,61,.08);padding:32px 26px;width:100%;max-width:380px;text-align:center}
  .login-card img{width:64px;height:64px;margin-bottom:10px}
  .login-card h1{font-size:22px;margin:0 0 4px;color:var(--blue)}
  .login-card p{margin:0 0 22px;color:var(--muted);font-size:14px}
  .login-card input{width:100%;margin-bottom:12px}
  .login-card .err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}

  input[type=email],input[type=password],input[type=search],select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,46,176,.12)}
  input[type=email],input[type=password]{direction:ltr;text-align:right}

  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:background .15s}
  .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
  .btn-light{background:#EEF1F8;color:var(--ink)}.btn-light:hover{background:#E3E8F3}
  .btn-wa{background:#E7F7EE;color:var(--green)}.btn-wa:hover{background:#D5F0E0}
  .btn-call{background:#EAF0FF;color:var(--blue)}.btn-call:hover{background:#DCE5FF}
  .btn-sm{padding:7px 12px;font-size:14px}
  .btn:disabled{opacity:.6;cursor:wait}

  /* layout */
  .top{background:var(--blue);color:#fff}
  .top-inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .top img{width:36px;height:36px;background:#fff;border-radius:9px;padding:3px}
  .top h1{font-size:18px;margin:0;flex:1}
  .top .who{font-size:13px;opacity:.85;direction:ltr}
  .top .btn-light{background:rgba(255,255,255,.14);color:#fff}
  .wrap{max-width:1200px;margin:0 auto;padding:20px}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  .stat{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line);cursor:pointer;transition:border-color .15s}
  .stat:hover,.stat.on{border-color:var(--blue)}
  .stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
  .stat span{font-size:13px;color:var(--muted)}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
  .filters input[type=search]{flex:1;min-width:200px}
  .filters select{min-width:140px}
  .count{font-size:14px;color:var(--muted);margin-bottom:10px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .card-head{display:flex;gap:12px;align-items:flex-start}
  .vicon{width:54px;height:42px;border-radius:10px;background:#F2F5FD;display:grid;place-items:center;flex:none;color:var(--blue)}
  .vicon svg{width:40px;height:22px;transform:scaleX(-1)}
  .vicon .b{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .vicon .g{fill:currentColor;opacity:.18}
  .vicon .w{fill:var(--yellow);stroke:currentColor;stroke-width:2}
  .card-head h3{margin:0;font-size:17px}
  .card-head .sub{font-size:13px;color:var(--muted)}
  .badge{margin-inline-start:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge[data-s="جديد"]{background:#EAF0FF;color:var(--blue)}
  .badge[data-s="تم التواصل"]{background:#FFF4D6;color:var(--orange)}
  .badge[data-s="مقبول"]{background:#E7F7EE;color:var(--green)}
  .badge[data-s="مرفوض"]{background:#FDECEC;color:var(--red)}

  .route{display:flex;align-items:center;gap:8px;background:#F7F8FC;border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px}
  .route .arrow{color:var(--yellow);font-size:18px}
  .route small{font-weight:400;color:var(--muted);margin-inline-start:auto;font-size:12px}

  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
  dt{color:var(--muted)}
  dd{margin:0;font-weight:500}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:12px;background:#EEF1F8;border-radius:999px;padding:2px 9px}
  .note{font-size:13px;background:#FFFBEF;border-radius:8px;padding:8px 10px;color:#5d4a10}

  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .admin-row{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
  .admin-row select{flex:none}
  .admin-row textarea{flex:1;min-width:160px;min-height:38px;height:38px;resize:vertical;font-size:14px;padding:8px 10px}
  .saved{font-size:12px;color:var(--green);align-self:center}

  .empty,.loading{text-align:center;color:var(--muted);padding:60px 20px;background:#fff;border-radius:16px;border:1px dashed var(--line)}

  /* photo viewer */
  .viewer{position:fixed;inset:0;background:rgba(10,15,35,.85);display:grid;place-items:center;z-index:50;padding:20px}
  .viewer img{max-width:100%;max-height:85vh;border-radius:12px;background:#fff}
  .viewer button{position:absolute;top:16px;left:16px}

  @media (max-width:520px){
    .stats{grid-template-columns:repeat(5,1fr);gap:6px}
    .stat{padding:10px 4px;text-align:center}
    .stat b{font-size:20px}
    .stat span{font-size:11px}
    .filters input[type=search]{flex-basis:100%}
    .filters select{flex:1 1 28%;min-width:0;font-size:14px}
    .filters .btn{flex:1}
    .grid{grid-template-columns:1fr}
    .top .who{display:none}
    .wrap{padding:14px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <img src="logo.png" alt="وصلت">
    <h1>لوحة السائقين</h1>
    <p>للمصرّح لهم من فريق وصلت فقط</p>
    <input type="email" id="email" placeholder="البريد الإلكتروني" required autocomplete="username">
    <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password">
    <button class="btn btn-primary" style="width:100%" id="login-btn">دخول</button>
    <div class="err" id="login-err"></div>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="top-inner">
      <img src="logo.png" alt="">
      <h1>لوحة السائقين والمركبات</h1>
      <span class="who" id="who"></span>
      <button class="btn btn-light btn-sm" id="logout">خروج</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats" id="stats"></div>

    <div class="filters">
      <input type="search" id="q" placeholder="بحث بالاسم أو الهاتف أو رقم اللوحة">
      <select id="f-status"><option value="">كل الحالات</option></select>
      <select id="f-vehicle"><option value="">كل المركبات</option></select>
      <select id="f-city"><option value="">كل المدن</option></select>
      <button class="btn btn-light btn-sm" id="refresh">تحديث</button>
      <button class="btn btn-light btn-sm" id="export">تصدير Excel (CSV)</button>
    </div>

    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div class="loading" id="loading">جارٍ تحميل البيانات...</div>
    <div class="empty" id="empty" hidden>لا توجد تسجيلات مطابقة</div>
  </div>
</div>

<div class="viewer" id="viewer" hidden><button class="btn btn-light" id="viewer-close">إغلاق</button><img id="viewer-img" alt=""></div>

<script>
const SUPABASE_URL = "https://fisgxnxnllplkghtsgqa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_sW5skDrm4X5wJBgz4phBWQ_6ICaUp2B";
const TABLE = "driver_registrations";
const BUCKET = "driver-docs";
const STATUSES = ["جديد", "تم التواصل", "مقبول", "مرفوض"];
const CITIES = ["الخرطوم","أم درمان","بحري","بورتسودان","عطبرة","الدامر","شندي","كسلا","حلفا الجديدة","القضارف","ود مدني","سنار","كوستي","ربك","دنقلا","مروي"];

const W = x => `<circle cx="${x}" cy="25" r="4.2" class="w"/>`;
const ICONS = {
  "حافلة (هايس)": '<path d="M5 25V11.5A3.5 3.5 0 0 1 8.5 8h33.5l10 8.5h4.5a3 3 0 0 1 3 3V25" class="b"/>' + W(16) + W(48),
  "بيك أب": '<path d="M5 25v-9h23V9h13l7 7h8a3 3 0 0 1 3 3v6" class="b"/><path d="M5 16h23" class="b"/>' + W(16) + W(48),
  "شاحنة متوسطة (دينا – إيسوزو)": '<rect x="5" y="6" width="34" height="17" rx="1.5" class="b"/><path d="M42 25V11h9l7 7v7" class="b"/><path d="M5 25h53" class="b"/>' + W(14) + W(50),
  "شاحنة كبيرة (10 أطنان)": '<rect x="3" y="4" width="40" height="19" rx="1.5" class="b"/><path d="M45 25V9h8l7 8v8" class="b"/><path d="M3 25h57" class="b"/>' + W(10) + W(20) + W(53),
  "شاحنة بمقطورة": '<rect x="2" y="9" width="40" height="12" rx="1" class="b"/><path d="M44 25V10h8l8 8v7" class="b"/>' + W(8) + W(17) + W(32) + W(54),
  "أخرى": '<rect x="16" y="5" width="32" height="22" rx="5" class="b"/><path d="M32 11v10M27 16h10" class="b"/>',
};

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let rows = [];
let statFilter = "";

// ---------- auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  session ? enter(session) : showLogin();
}
function showLogin() { $("login").hidden = false; $("app").hidden = true; }

$("login-form").onsubmit = async e => {
  e.preventDefault();
  $("login-btn").disabled = true; $("login-err").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("login-btn").disabled = false;
  if (error) { $("login-err").textContent = "البريد أو كلمة المرور غير صحيحة"; return; }
  enter(data.session);
};
$("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function enter(session) {
  $("login").hidden = true; $("app").hidden = false;
  $("who").textContent = session.user.email;
  await load();
}

// ---------- data ----------
async function load() {
  $("loading").hidden = false; $("grid").innerHTML = ""; $("empty").hidden = true;
  const { data, error } = await sb.from(TABLE).select("*").order("created_at", { ascending: false });
  $("loading").hidden = true;
  if (error) { $("loading").hidden = false; $("loading").textContent = "تعذّر تحميل البيانات: " + error.message; return; }
  rows = data || [];
  if (!rows.length && !(await isAdmin())) {
    $("loading").hidden = false;
    $("loading").textContent = "هذا الحساب غير مضاف كأدمن. أضف بريده إلى جدول admins في Supabase.";
    return;
  }
  fillFilters(); render();
}
async function isAdmin() {
  const { data } = await sb.rpc("is_admin");
  return data === true;
}

function fillFilters() {
  const keep = (sel, opts) => { const v = sel.value; sel.length = 1; opts.forEach(o => sel.add(new Option(o, o))); sel.value = v; };
  keep($("f-status"), STATUSES);
  keep($("f-vehicle"), [...new Set(rows.map(r => r.vehicle_type).filter(Boolean))]);
  keep($("f-city"), CITIES);
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const st = $("f-status").value || statFilter;
  const vt = $("f-vehicle").value;
  const city = $("f-city").value;
  return rows.filter(r =>
    (!st || r.status === st) &&
    (!vt || r.vehicle_type === vt) &&
    (!city || r.residence_city === city || r.route_from === city || r.route_to === city || (r.cities || []).includes(city)) &&
    (!q || [r.full_name, r.phone, r.whatsapp, r.plate_number, r.vehicle_model].some(v => (v || "").toLowerCase().includes(q)))
  );
}

function renderStats() {
  const c = s => rows.filter(r => r.status === s).length;
  const items = [["", "الكل", rows.length], ...STATUSES.map(s => [s, s, c(s)])];
  $("stats").innerHTML = items.map(([k, label, n]) =>
    `<div class="stat ${statFilter === k && !$("f-status").value ? "on" : ""}" data-k="${esc(k)}"><b>${n}</b><span>${esc(label)}</span></div>`).join("");
  $("stats").querySelectorAll(".stat").forEach(el => el.onclick = () => { statFilter = el.dataset.k; $("f-status").value = ""; render(); });
}

const fmtDate = d => new Date(d).toLocaleString("ar-EG", { timeZone: "Africa/Khartoum", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const waNum = p => (p || "").replace(/\D/g, "").replace(/^0/, "249");

function card(r) {
  const wa = r.whatsapp || r.phone;
  const otherCities = (r.cities || []).map(c => `<span class="tag">${esc(c)}</span>`).join("");
  const photos = [
    r.vehicle_photo_path ? `<button class="btn btn-light btn-sm" data-photo="${esc(r.vehicle_photo_path)}">صورة المركبة</button>` : "",
    r.license_photo_path ? `<button class="btn btn-light btn-sm" data-photo="${esc(r.license_photo_path)}">صورة الرخصة</button>` : "",
  ].join("");
  return `
  <article class="card" data-id="${r.id}">
    <div class="card-head">
      <div class="vicon"><svg viewBox="0 0 64 32">${ICONS[r.vehicle_type] || ICONS["أخرى"]}</svg></div>
      <div>
        <h3>${esc(r.full_name)}</h3>
        <div class="sub">${esc(r.vehicle_type)} · ${esc(r.capacity_tons)} طن · ${esc(r.cover_type)}</div>
      </div>
      <span class="badge" data-s="${esc(r.status)}">${esc(r.status)}</span>
    </div>

    <div class="route">${esc(r.route_from)} <span class="arrow">←</span> ${esc(r.route_to)}<small>${esc(r.work_scope)}</small></div>

    <dl>
      <dt>الهاتف</dt><dd dir="ltr" style="text-align:right">${esc(r.phone)}${r.whatsapp ? " · واتساب " + esc(r.whatsapp) : ""}</dd>
      <dt>الإقامة</dt><dd>${esc(r.residence_city)} – ${esc(r.residence_area)}</dd>
      <dt>المركبة</dt><dd>${esc(r.vehicle_model)}${r.vehicle_year ? " · " + esc(r.vehicle_year) : ""} · لوحة ${esc(r.plate_number)}</dd>
      <dt>الملكية</dt><dd>${esc(r.ownership)}</dd>
      <dt>الرخصة</dt><dd>${esc(r.license_type)}${r.experience_years != null ? " · خبرة " + esc(r.experience_years) + " سنة" : ""}</dd>
      <dt>الأجرة</dt><dd>${esc(r.pricing_method)}${r.approx_price ? " · حوالي " + Number(r.approx_price).toLocaleString("ar-EG") + " جنيه" : ""}</dd>
      ${r.other_routes ? `<dt>خطوط أخرى</dt><dd>${esc(r.other_routes)}</dd>` : ""}
      ${r.worked_with_companies ? `<dt>عمل مع شركات</dt><dd>${esc(r.worked_with_companies)}</dd>` : ""}
      ${r.availability ? `<dt>الأيام</dt><dd>${esc(r.availability)}</dd>` : ""}
      <dt>التسجيل</dt><dd>${fmtDate(r.created_at)}</dd>
    </dl>
    ${otherCities ? `<div class="tags">${otherCities}</div>` : ""}
    ${r.notes ? `<div class="note">ملاحظة السائق: ${esc(r.notes)}</div>` : ""}

    <div class="actions">
      <a class="btn btn-call btn-sm" href="tel:${esc(r.phone)}">اتصال</a>
      <a class="btn btn-wa btn-sm" href="https://wa.me/${waNum(wa)}" target="_blank" rel="noopener">واتساب</a>
      ${photos}
    </div>

    <div class="admin-row">
      <select data-status>${STATUSES.map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      <textarea data-notes placeholder="ملاحظات الفريق">${esc(r.admin_notes)}</textarea>
      <span class="saved" hidden>تم الحفظ</span>
    </div>
  </article>`;
}

function render() {
  renderStats();
  const list = filtered();
  $("count").textContent = `${list.length} من ${rows.length} تسجيل`;
  $("grid").innerHTML = list.map(card).join("");
  $("empty").hidden = list.length > 0;
}

// ---------- updates ----------
async function save(id, patch, cardEl) {
  const { error } = await sb.from(TABLE).update(patch).eq("id", id);
  if (error) { alert("تعذّر الحفظ: " + error.message); return false; }
  Object.assign(rows.find(r => r.id === id), patch);
  const s = cardEl.querySelector(".saved"); s.hidden = false; setTimeout(() => s.hidden = true, 1500);
  return true;
}

$("grid").addEventListener("change", async e => {
  const cardEl = e.target.closest(".card"); if (!cardEl) return;
  const id = cardEl.dataset.id;
  if (e.target.matches("[data-status]")) {
    if (await save(id, { status: e.target.value }, cardEl)) {
      const b = cardEl.querySelector(".badge"); b.textContent = e.target.value; b.dataset.s = e.target.value;
      renderStats();
    }
  }
  if (e.target.matches("[data-notes]")) save(id, { admin_notes: e.target.value.trim() || null }, cardEl);
});

$("grid").addEventListener("click", async e => {
  const btn = e.target.closest("[data-photo]"); if (!btn) return;
  btn.disabled = true;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(btn.dataset.photo, 600);
  btn.disabled = false;
  if (error) { alert("تعذّر فتح الصورة"); return; }
  $("viewer-img").src = data.signedUrl; $("viewer").hidden = false;
});
$("viewer-close").onclick = () => { $("viewer").hidden = true; $("viewer-img").src = ""; };
$("viewer").onclick = e => { if (e.target.id === "viewer") $("viewer-close").onclick(); };

["q", "f-status", "f-vehicle", "f-city"].forEach(id => $(id).addEventListener("input", () => { if (id === "f-status") statFilter = ""; render(); }));
$("refresh").onclick = load;

// ---------- export ----------
$("export").onclick = () => {
  const cols = [
    ["created_at","تاريخ التسجيل"],["status","الحالة"],["full_name","الاسم"],["phone","الهاتف"],["whatsapp","واتساب"],
    ["residence_city","مدينة الإقامة"],["residence_area","الحي"],["license_type","الرخصة"],["experience_years","سنوات الخبرة"],
    ["vehicle_type","نوع المركبة"],["vehicle_model","الموديل"],["vehicle_year","سنة الصنع"],["capacity_tons","الحمولة (طن)"],
    ["cover_type","التغطية"],["plate_number","اللوحة"],["ownership","الملكية"],["work_scope","نطاق العمل"],
    ["route_from","الخط من"],["route_to","الخط إلى"],["other_routes","خطوط أخرى"],["cities","المدن"],["availability","الأيام"],
    ["pricing_method","طريقة الأجرة"],["approx_price","السعر التقريبي"],["worked_with_companies","عمل مع شركات"],
    ["notes","ملاحظات السائق"],["admin_notes","ملاحظات الفريق"],
  ];
  const cell = v => { v = Array.isArray(v) ? v.join("، ") : (v ?? ""); return `"${String(v).replace(/"/g, '""')}"`; };
  const csv = [cols.map(c => cell(c[1])).join(","), ...filtered().map(r => cols.map(([k]) => cell(k === "created_at" ? fmtDate(r[k]) : r[k])).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = `سائقين-وصلت-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

boot();
</script>
</body>
</html>
