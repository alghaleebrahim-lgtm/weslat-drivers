<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة السائقين – وصلت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vehicles.js"></script>
<style>
  :root{--blue:#002EB0;--blue-dark:#00218A;--yellow:#FFBA08;--ink:#0F1B3D;--muted:#5B6585;--line:#E1E6F0;--bg:#F3F5FB;--green:#1B8A4B;--red:#C62828;--orange:#B26A00}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit}
  [hidden]{display:none!important}

  .login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(15,27,61,.08);padding:32px 26px;width:100%;max-width:380px;text-align:center}
  .login-card img{width:64px;height:64px;margin-bottom:10px}
  .login-card h1{font-size:22px;margin:0 0 4px;color:var(--blue)}
  .login-card p{margin:0 0 22px;color:var(--muted);font-size:14px}
  .login-card input{width:100%;margin-bottom:12px}
  .login-card .err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}

  input[type=email],input[type=password],input[type=search],input[type=text],input[type=tel],input[type=number],select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;color:var(--ink);outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,46,176,.12)}
  input[type=email],input[type=password],input[type=tel]{direction:ltr;text-align:right}

  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:background .15s;white-space:nowrap}
  .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
  .btn-yellow{background:var(--yellow);color:var(--ink)}.btn-yellow:hover{background:#F0AE00}
  .btn-light{background:#EEF1F8;color:var(--ink)}.btn-light:hover{background:#E3E8F3}
  .btn-wa{background:#E7F7EE;color:var(--green)}.btn-wa:hover{background:#D5F0E0}
  .btn-call{background:#EAF0FF;color:var(--blue)}.btn-call:hover{background:#DCE5FF}
  .btn-ok{background:var(--green);color:#fff}.btn-ok:hover{background:#15703D}
  .btn-no{background:#FDECEC;color:var(--red)}.btn-no:hover{background:#FADADA}
  .btn-sm{padding:7px 12px;font-size:14px}
  .btn:disabled{opacity:.6;cursor:wait}

  .top{background:var(--blue);color:#fff}
  .top-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .top img{width:36px;height:36px;background:#fff;border-radius:9px;padding:3px}
  .top h1{font-size:18px;margin:0;flex:1}
  .top .who{font-size:13px;opacity:.85;direction:ltr}
  .top .btn-light{background:rgba(255,255,255,.14);color:#fff}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 20px 40px}

  .tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:0;padding:12px 16px;font-weight:700;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  .tab .n{background:#E7ECF7;color:var(--ink);border-radius:999px;font-size:12px;padding:2px 9px}
  .tab.on .n{background:var(--blue);color:#fff}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{background:#fff;border-radius:14px;padding:12px 16px;border:1px solid var(--line);cursor:pointer;text-align:right}
  .stat:hover,.stat.on{border-color:var(--blue)}
  .stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
  .stat span{font-size:13px;color:var(--muted)}

  .finder{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .finder h3{margin:0 0 10px;font-size:16px;color:var(--blue)}
  .finder .row{display:grid;grid-template-columns:1fr auto 1fr 1fr auto;gap:10px;align-items:center}
  .finder .swap{background:#EEF1F8;border:0;border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:18px}
  .finder p{margin:8px 0 0;font-size:13px;color:var(--muted)}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
  .filters input[type=search]{flex:1;min-width:200px;width:auto}
  .filters select{width:auto;min-width:140px}
  .count{font-size:14px;color:var(--muted);margin-bottom:10px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:11px}
  .card-head{display:flex;gap:12px;align-items:flex-start}
  .vicon{width:54px;height:42px;border-radius:10px;background:#F2F5FD;display:grid;place-items:center;flex:none;color:var(--blue)}
  .vicon svg{width:40px;height:22px;transform:scaleX(-1)}
  .vicon .b,.vbox .b{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .vicon .g,.vbox .g{fill:currentColor;opacity:.18}
  .vicon .w{fill:var(--yellow);stroke:currentColor;stroke-width:2}
  .card-head h3{margin:0;font-size:17px}
  .card-head .sub{font-size:13px;color:var(--muted)}
  .badges{margin-inline-start:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .badge[data-s="جديد"]{background:#EAF0FF;color:var(--blue)}
  .badge[data-s="تم التواصل"]{background:#FFF4D6;color:var(--orange)}
  .badge[data-s="مقبول"]{background:#E7F7EE;color:var(--green)}
  .badge[data-s="مرفوض"]{background:#FDECEC;color:var(--red)}
  .badge.match{background:var(--yellow);color:var(--ink)}
  .badge.manual{background:#F1EAFE;color:#5B2DB0}

  .route{display:flex;align-items:center;gap:8px;background:#F7F8FC;border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px}
  .route .arrow{color:var(--yellow);font-size:18px}
  .route small{font-weight:400;color:var(--muted);margin-inline-start:auto;font-size:12px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
  dt{color:var(--muted)}
  dd{margin:0;font-weight:500}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:12px;background:#EEF1F8;border-radius:999px;padding:2px 9px}
  .note{font-size:13px;background:#FFFBEF;border-radius:8px;padding:8px 10px;color:#5d4a10}
  .meta{font-size:12px;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .nophoto{font-size:13px;color:var(--muted);align-self:center;background:#F7F8FC;border-radius:8px;padding:6px 10px}
  .admin-row{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:11px;flex-wrap:wrap;align-items:center}
  .admin-row select{width:auto;flex:none}
  .admin-row textarea{flex:1;min-width:160px;min-height:38px;height:38px;resize:vertical;font-size:14px;padding:8px 10px;width:auto}
  .saved{font-size:12px;color:var(--green)}

  .empty,.loading{text-align:center;color:var(--muted);padding:50px 20px;background:#fff;border-radius:16px;border:1px dashed var(--line)}

  .viewer{position:fixed;inset:0;background:rgba(10,15,35,.85);display:grid;place-items:center;z-index:60;padding:20px}
  .viewer img{max-width:100%;max-height:85vh;border-radius:12px;background:#fff}
  .viewer button{position:absolute;top:16px;left:16px}

  /* add-driver modal */
  dialog{border:0;border-radius:18px;padding:0;width:min(760px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(15,27,61,.3)}
  dialog::backdrop{background:rgba(10,15,35,.55)}
  .dlg-head{position:sticky;top:0;background:#fff;padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:2}
  .dlg-head h2{margin:0;font-size:19px;color:var(--blue)}
  .dlg-body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .dlg-body .full{grid-column:1/-1}
  .dlg-body label.q{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
  .dlg-body label.q .req{color:var(--red)}
  .dlg-body h4{grid-column:1/-1;margin:8px 0 0;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
  .dlg-foot{position:sticky;bottom:0;background:#fff;padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .dlg-foot .msg{flex:1;font-size:14px;color:var(--red)}
  .vehicles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .vcard{position:relative;display:block}
  .vcard input{position:absolute;opacity:0;pointer-events:none}
  .vbox{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px 8px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:center;height:100%}
  .vbox svg{width:56px;height:28px;margin-bottom:5px;transform:scaleX(-1);color:#8A93AE}
  .vbox .w{fill:#fff;stroke:currentColor;stroke-width:2}
  .vbox b{font-size:13.5px}.vbox small{font-size:11px;color:var(--muted)}
  .vcard input:checked+.vbox{border-color:var(--blue);background:#F2F5FD}
  .vcard input:checked+.vbox svg{color:var(--blue)}
  .vcard input:checked+.vbox .w{fill:var(--yellow)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;pointer-events:none}
  .chip span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer;background:#fff}
  .chip input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}

  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .finder .row{grid-template-columns:1fr auto 1fr}
    .finder .row select:nth-of-type(3),.finder .row .btn{grid-column:1/-1}
    .grid{grid-template-columns:1fr}
    .top .who{display:none}
    .wrap{padding:14px}
    .dlg-body{grid-template-columns:1fr}
    .vehicles{grid-template-columns:repeat(2,1fr)}
    .filters select{flex:1 1 40%;min-width:0}
    .filters input[type=search]{flex-basis:100%}
  }
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <img src="logo.png" alt="وصلت">
    <h1>لوحة السائقين</h1>
    <p>لموظفي وصلت المصرّح لهم فقط</p>
    <input type="email" id="email" placeholder="البريد الإلكتروني" required autocomplete="username">
    <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password">
    <button class="btn btn-primary" style="width:100%" id="login-btn">دخول</button>
    <div class="err" id="login-err"></div>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-inner">
      <img src="logo.png" alt="">
      <h1>لوحة السائقين والمركبات</h1>
      <span class="who" id="who"></span>
      <button class="btn btn-yellow btn-sm" id="add-btn">+ إضافة سائق</button>
      <button class="btn btn-light btn-sm" id="logout">خروج</button>
    </div>
  </header>

  <div class="wrap">
    <nav class="tabs">
      <button class="tab on" data-tab="requests">طلبات الانضمام <span class="n" id="n-req">0</span></button>
      <button class="tab" data-tab="approved">السواقين المعتمدين <span class="n" id="n-app">0</span></button>
    </nav>

    <!-- requests -->
    <section id="tab-requests">
      <div class="stats" id="stats"></div>
    </section>

    <!-- approved: route finder -->
    <section id="tab-approved" hidden>
      <div class="finder">
        <h3>ابحث عن سائق لخط معيّن</h3>
        <div class="row">
          <select id="r-from"><option value="">من (أي مدينة)</option></select>
          <button class="swap" id="r-swap" title="عكس الاتجاه" aria-label="عكس الاتجاه">⇄</button>
          <select id="r-to"><option value="">إلى (أي مدينة)</option></select>
          <select id="r-vehicle"><option value="">أي نوع مركبة</option></select>
          <button class="btn btn-light" id="r-clear">مسح</button>
        </div>
        <p>النتائج مرتبة: السائقين على نفس الخط أولاً، بعدهم البيشتغلوا عليه كخط إضافي، بعدهم البيغطوا المدينتين.</p>
      </div>
    </section>

    <div class="filters">
      <input type="search" id="q" placeholder="بحث بالاسم أو الهاتف أو رقم اللوحة">
      <select id="f-status"><option value="">كل الحالات</option></select>
      <select id="f-vehicle"><option value="">كل المركبات</option></select>
      <select id="f-city"><option value="">كل المدن</option></select>
      <button class="btn btn-light btn-sm" id="refresh">تحديث</button>
      <button class="btn btn-light btn-sm" id="export">تصدير Excel</button>
    </div>

    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div class="loading" id="loading">جارٍ تحميل البيانات...</div>
    <div class="empty" id="empty" hidden>لا توجد نتائج</div>
  </div>
</div>

<!-- add driver -->
<dialog id="dlg">
  <form id="add-form" method="dialog" novalidate>
    <div class="dlg-head"><h2>إضافة سائق</h2><button type="button" class="btn btn-light btn-sm" id="dlg-close">إغلاق</button></div>
    <div class="dlg-body">
      <div><label class="q">الفرع<span class="req">*</span></label><select name="branch" id="a-branch" required></select></div>
      <div><label class="q">الحالة<span class="req">*</span></label><select name="status"><option>مقبول</option><option>جديد</option><option>تم التواصل</option></select></div>

      <h4>بيانات السائق</h4>
      <div class="full"><label class="q">الاسم الكامل<span class="req">*</span></label><input type="text" name="full_name" required></div>
      <div><label class="q">رقم الهاتف<span class="req">*</span></label><input type="tel" name="phone" required placeholder="0912345678"></div>
      <div><label class="q">رقم الواتساب</label><input type="tel" name="whatsapp" placeholder="لو مختلف"></div>
      <div><label class="q">مدينة الإقامة<span class="req">*</span></label><select name="residence_city" data-cities required><option value="">اختر</option></select></div>
      <div><label class="q">الحي<span class="req">*</span></label><input type="text" name="residence_area" required></div>
      <div><label class="q">نوع الرخصة<span class="req">*</span></label><select name="license_type" required><option value="">اختر</option><option>خاصة</option><option>عامة</option><option>نقل ثقيل</option></select></div>
      <div><label class="q">سنوات الخبرة</label><input type="number" name="experience_years" min="0"></div>

      <h4>بيانات المركبة</h4>
      <div class="full"><label class="q">نوع المركبة<span class="req">*</span></label><div class="vehicles" id="a-vehicles"></div></div>
      <div><label class="q">الماركة والموديل<span class="req">*</span></label><input type="text" name="vehicle_model" required></div>
      <div><label class="q">سنة الصنع</label><input type="number" name="vehicle_year" min="1970" max="2027"></div>
      <div><label class="q">الحمولة (طن)<span class="req">*</span></label><input type="number" name="capacity_tons" step="0.1" min="0.1" required></div>
      <div><label class="q">رقم اللوحة<span class="req">*</span></label><input type="text" name="plate_number" required></div>
      <div><label class="q">التغطية<span class="req">*</span></label><select name="cover_type" required><option value="">اختر</option><option>مغلقة</option><option>مغطاة بمشمع</option><option>مكشوفة</option></select></div>
      <div><label class="q">الملكية<span class="req">*</span></label><select name="ownership" required><option value="">اختر</option><option>ملك للسائق</option><option>ملك لشخص آخر</option></select></div>
      <div><label class="q">صورة المركبة</label><input type="file" name="vehicle_photo" accept="image/*"></div>
      <div><label class="q">صورة الرخصة</label><input type="file" name="license_photo" accept="image/*"></div>

      <h4>الخط والأجرة</h4>
      <div><label class="q">الخط من<span class="req">*</span></label><select name="route_from" data-cities required><option value="">اختر</option></select></div>
      <div><label class="q">الخط إلى<span class="req">*</span></label><select name="route_to" data-cities required><option value="">اختر</option></select></div>
      <div class="full"><label class="q">خطوط أخرى</label><input type="text" name="other_routes" placeholder="مثلاً: مدني – كسلا، عطبرة – بورتسودان"></div>
      <div class="full"><label class="q">المدن البيغطيها</label><div class="chips" id="a-cities"></div></div>
      <div><label class="q">نطاق العمل<span class="req">*</span></label><select name="work_scope" required><option value="">اختر</option><option>داخل المدينة</option><option>بين الولايات</option><option>كلاهما</option></select></div>
      <div><label class="q">طريقة الأجرة<span class="req">*</span></label><select name="pricing_method" required><option value="">اختر</option><option>بالرحلة</option><option>باليوم</option><option>بالطن</option></select></div>
      <div><label class="q">السعر التقريبي (جنيه)</label><input type="number" name="approx_price" min="0"></div>
      <div><label class="q">الأيام المتاحة</label><select name="availability"><option value="">اختر</option><option>كل الأيام</option><option>أيام محددة</option></select></div>
      <div class="full"><label class="q">ملاحظات الفريق</label><textarea name="admin_notes" rows="2"></textarea></div>
    </div>
    <div class="dlg-foot">
      <span class="msg" id="a-msg"></span>
      <button type="submit" class="btn btn-primary" id="a-save">حفظ السائق</button>
    </div>
  </form>
</dialog>

<div class="viewer" id="viewer" hidden><button class="btn btn-light" id="viewer-close">إغلاق</button><img id="viewer-img" alt=""></div>

<script>
const SUPABASE_URL = "https://fisgxnxnllplkghtsgqa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_sW5skDrm4X5wJBgz4phBWQ_6ICaUp2B";
const TABLE = "driver_registrations";
const BUCKET = "driver-docs";
const REQ_STATUSES = ["جديد", "تم التواصل", "مرفوض"];
const ALL_STATUSES = ["جديد", "تم التواصل", "مقبول", "مرفوض"];

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s || "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/(^|\s)ود\s+/g, "$1").replace(/\s+/g, " ").trim();
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let rows = [];
let tab = "requests";
let statFilter = "";

// ---------- static UI ----------
const fill = (sel, opts) => { const v = sel.value; sel.length = 1; opts.forEach(o => sel.add(new Option(o, o))); sel.value = v; };
fill($("r-from"), CITIES); fill($("r-to"), CITIES); fill($("f-city"), CITIES);
fill($("r-vehicle"), VEHICLES.filter(x => x.v !== "أخرى").map(x => x.v));
document.querySelectorAll("#add-form select[data-cities]").forEach(s => fill(s, CITIES));
$("a-branch").innerHTML = BRANCHES.map(b => `<option>${b}</option>`).join("");
$("a-vehicles").innerHTML = VEHICLES.map(x => vehicleCard("vehicle_type", x)).join("");
$("a-cities").innerHTML = CITIES.map(c => `<label class="chip"><input type="checkbox" name="cities" value="${c}"><span>${c}</span></label>`).join("");

// ---------- auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  session ? enter(session) : showLogin();
}
function showLogin() { $("login").hidden = false; $("app").hidden = true; }
$("login-form").onsubmit = async e => {
  e.preventDefault();
  $("login-btn").disabled = true; $("login-err").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("login-btn").disabled = false;
  if (error) { $("login-err").textContent = "البريد أو كلمة المرور غير صحيحة"; return; }
  enter(data.session);
};
$("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };
async function enter(session) {
  $("login").hidden = true; $("app").hidden = false;
  $("who").textContent = session.user.email;
  await load();
}

// ---------- data ----------
async function load() {
  $("loading").hidden = false; $("loading").textContent = "جارٍ تحميل البيانات..."; $("grid").innerHTML = ""; $("empty").hidden = true;
  const { data, error } = await sb.from(TABLE).select("*").order("created_at", { ascending: false });
  if (error) { $("loading").textContent = "تعذّر تحميل البيانات: " + error.message; return; }
  rows = data || [];
  if (!rows.length) {
    const { data: ok } = await sb.rpc("is_admin");
    if (ok !== true) { $("loading").textContent = "هذا الحساب غير مضاف كموظف. أضف بريده إلى جدول admins في Supabase."; return; }
  }
  $("loading").hidden = true;
  fill($("f-vehicle"), [...new Set(rows.map(r => r.vehicle_type).filter(Boolean))]);
  render();
}

// ---------- tabs ----------
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  tab = t.dataset.tab; statFilter = "";
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  $("tab-requests").hidden = tab !== "requests";
  $("tab-approved").hidden = tab !== "approved";
  $("f-status").parentElement && ($("f-status").hidden = tab === "approved");
  render();
});
fill($("f-status"), REQ_STATUSES);

// ---------- route matching ----------
function routeMatch(r, from, to) {
  if (!from && !to) return { score: 1, label: "" };
  const f = norm(from), t = norm(to);
  const rf = norm(r.route_from), rt = norm(r.route_to);
  const other = norm(r.other_routes);
  const segs = String(r.other_routes || "").split(/[،,؛;\n\/]|\sو\s/).map(norm).filter(Boolean);
  const covered = new Set([rf, rt, norm(r.residence_city), ...(r.cities || []).map(norm)]);
  if (f && t) {
    if ((rf === f && rt === t) || (rf === t && rt === f)) return { score: 3, label: "نفس الخط" };
    if (segs.some(sg => sg.includes(f) && sg.includes(t))) return { score: 2, label: "خط إضافي" };
    if ((covered.has(f) || other.includes(f)) && (covered.has(t) || other.includes(t))) return { score: 1, label: "يغطي المدينتين" };
    return { score: 0 };
  }
  const c = f || t;
  if (rf === c || rt === c) return { score: 3, label: "على الخط" };
  if (other.includes(c)) return { score: 2, label: "خط إضافي" };
  if (covered.has(c)) return { score: 1, label: "يغطي المدينة" };
  return { score: 0 };
}

function listFor() {
  const q = $("q").value.trim().toLowerCase();
  const vt = $("f-vehicle").value;
  const city = $("f-city").value;
  const base = rows.filter(r => (tab === "approved") === (r.status === "مقبول"));
  let list = base.filter(r =>
    (tab === "approved" || !($("f-status").value || statFilter) || r.status === ($("f-status").value || statFilter)) &&
    (!vt || r.vehicle_type === vt) &&
    (!city || [r.residence_city, r.route_from, r.route_to, ...(r.cities || [])].includes(city)) &&
    (!q || [r.full_name, r.phone, r.whatsapp, r.plate_number, r.vehicle_model].some(v => (v || "").toLowerCase().includes(q)))
  );
  if (tab === "approved") {
    const from = $("r-from").value, to = $("r-to").value, rv = $("r-vehicle").value;
    list = list.filter(r => !rv || r.vehicle_type === rv)
      .map(r => ({ r, m: routeMatch(r, from, to) }))
      .filter(x => x.m.score > 0)
      .sort((a, b) => b.m.score - a.m.score);
    return { base, list };
  }
  return { base, list: list.map(r => ({ r, m: { score: 1, label: "" } })) };
}

function renderStats() {
  const req = rows.filter(r => r.status !== "مقبول");
  const items = [["", "كل الطلبات", req.length], ...REQ_STATUSES.map(s => [s, s, req.filter(r => r.status === s).length])];
  $("stats").innerHTML = items.map(([k, label, n]) =>
    `<button class="stat ${statFilter === k && !$("f-status").value ? "on" : ""}" data-k="${esc(k)}"><b>${n}</b><span>${esc(label)}</span></button>`).join("");
  $("stats").querySelectorAll(".stat").forEach(el => el.onclick = () => { statFilter = el.dataset.k; $("f-status").value = ""; render(); });
  $("n-req").textContent = req.filter(r => r.status === "جديد").length || req.length;
  $("n-app").textContent = rows.filter(r => r.status === "مقبول").length;
}

const fmtDate = d => d ? new Date(d).toLocaleString("ar-EG", { timeZone: "Africa/Khartoum", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
const waNum = p => (p || "").replace(/\D/g, "").replace(/^0/, "249");

function card({ r, m }) {
  const approved = r.status === "مقبول";
  const photos = [
    r.vehicle_photo_path ? `<button class="btn btn-light btn-sm" data-photo="${esc(r.vehicle_photo_path)}">صورة المركبة</button>` : "",
    r.license_photo_path ? `<button class="btn btn-light btn-sm" data-photo="${esc(r.license_photo_path)}">صورة الرخصة</button>` : "",
  ].join("") || `<span class="nophoto">لم تُرفع صور</span>`;
  const cities = (r.cities || []).map(c => `<span class="tag">${esc(c)}</span>`).join("");
  const decide = approved ? "" : `
      <button class="btn btn-ok btn-sm" data-set="مقبول">قبول واعتماد</button>
      ${r.status !== "مرفوض" ? `<button class="btn btn-no btn-sm" data-set="مرفوض">رفض</button>` : ""}`;
  return `
  <article class="card" data-id="${r.id}">
    <div class="card-head">
      <div class="vicon"><svg viewBox="0 0 64 32">${vehicleIcon(r.vehicle_type)}</svg></div>
      <div>
        <h3>${esc(r.full_name)}</h3>
        <div class="sub">${esc(r.vehicle_type)} · ${esc(r.capacity_tons)} طن · ${esc(r.cover_type)}</div>
      </div>
      <div class="badges">
        ${m.label ? `<span class="badge match">${esc(m.label)}</span>` : `<span class="badge" data-s="${esc(r.status)}">${esc(r.status)}</span>`}
        ${r.source === "manual" ? `<span class="badge manual">أُضيف يدوياً${r.branch ? " · " + esc(r.branch) : ""}</span>` : ""}
      </div>
    </div>
    <div class="route">${esc(r.route_from)} <span class="arrow">←</span> ${esc(r.route_to)}<small>${esc(r.work_scope)}</small></div>
    <dl>
      <dt>الهاتف</dt><dd dir="ltr" style="text-align:right">${esc(r.phone)}${r.whatsapp && r.whatsapp !== r.phone ? " · واتساب " + esc(r.whatsapp) : ""}</dd>
      <dt>الإقامة</dt><dd>${esc(r.residence_city)} – ${esc(r.residence_area)}</dd>
      <dt>المركبة</dt><dd>${esc(r.vehicle_model)}${r.vehicle_year ? " · " + esc(r.vehicle_year) : ""} · لوحة ${esc(r.plate_number)}</dd>
      <dt>الملكية</dt><dd>${esc(r.ownership)}</dd>
      <dt>الرخصة</dt><dd>${esc(r.license_type)}${r.experience_years != null ? " · خبرة " + esc(r.experience_years) + " سنة" : ""}</dd>
      <dt>الأجرة</dt><dd>${esc(r.pricing_method)} · ${r.approx_price ? "حوالي " + Number(r.approx_price).toLocaleString("ar-EG") + " جنيه" : "السعر غير محدد"}</dd>
      ${r.other_routes ? `<dt>خطوط أخرى</dt><dd>${esc(r.other_routes)}</dd>` : ""}
      ${r.availability ? `<dt>الأيام</dt><dd>${esc(r.availability)}</dd>` : ""}
    </dl>
    ${cities ? `<div class="tags">${cities}</div>` : ""}
    ${r.notes ? `<div class="note">ملاحظة السائق: ${esc(r.notes)}</div>` : ""}
    <div class="meta">${approved && r.approved_at ? "اعتُمد " + fmtDate(r.approved_at) + (r.approved_by ? " بواسطة " + esc(r.approved_by) : "") : "سُجّل " + fmtDate(r.created_at) + (r.added_by ? " بواسطة " + esc(r.added_by) : "")}</div>
    <div class="actions">
      <a class="btn btn-call btn-sm" href="tel:${esc(r.phone)}">اتصال</a>
      <a class="btn btn-wa btn-sm" href="https://wa.me/${waNum(r.whatsapp || r.phone)}" target="_blank" rel="noopener">واتساب</a>
      ${photos}
    </div>
    <div class="admin-row">
      ${decide}
      <select data-status aria-label="الحالة">${ALL_STATUSES.map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      <textarea data-notes placeholder="ملاحظات الفريق">${esc(r.admin_notes)}</textarea>
      <span class="saved" hidden>تم الحفظ</span>
    </div>
  </article>`;
}

function render() {
  renderStats();
  const { base, list } = listFor();
  $("count").textContent = tab === "approved"
    ? `${list.length} سائق معتمد مطابق من ${base.length}`
    : `${list.length} من ${base.length} طلب`;
  $("grid").innerHTML = list.map(card).join("");
  $("empty").hidden = list.length > 0;
  $("empty").textContent = tab === "approved" && ($("r-from").value || $("r-to").value)
    ? "ما في سائق معتمد على الخط ده حالياً" : "لا توجد نتائج";
}

// ---------- updates ----------
async function save(id, patch, cardEl) {
  const { data, error } = await sb.from(TABLE).update(patch).eq("id", id).select().single();
  if (error) { alert("تعذّر الحفظ: " + error.message); return false; }
  Object.assign(rows.find(r => r.id === id), data || patch);
  const s = cardEl?.querySelector(".saved"); if (s) { s.hidden = false; setTimeout(() => s.hidden = true, 1500); }
  return true;
}
$("grid").addEventListener("change", async e => {
  const cardEl = e.target.closest(".card"); if (!cardEl) return;
  const id = cardEl.dataset.id;
  if (e.target.matches("[data-status]") && await save(id, { status: e.target.value }, cardEl)) render();
  if (e.target.matches("[data-notes]")) save(id, { admin_notes: e.target.value.trim() || null }, cardEl);
});
$("grid").addEventListener("click", async e => {
  const set = e.target.closest("[data-set]");
  if (set) {
    const cardEl = set.closest(".card");
    if (set.dataset.set === "مرفوض" && !confirm("رفض هذا الطلب؟")) return;
    set.disabled = true;
    if (await save(cardEl.dataset.id, { status: set.dataset.set }, cardEl)) render();
    else set.disabled = false;
    return;
  }
  const btn = e.target.closest("[data-photo]"); if (!btn) return;
  btn.disabled = true;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(btn.dataset.photo, 600);
  btn.disabled = false;
  if (error) { alert("تعذّر فتح الصورة"); return; }
  $("viewer-img").src = data.signedUrl; $("viewer").hidden = false;
});
$("viewer-close").onclick = () => { $("viewer").hidden = true; $("viewer-img").src = ""; };
$("viewer").onclick = e => { if (e.target.id === "viewer") $("viewer-close").onclick(); };

["q", "f-status", "f-vehicle", "f-city", "r-from", "r-to", "r-vehicle"].forEach(id =>
  $(id).addEventListener("input", () => { if (id === "f-status") statFilter = ""; render(); }));
$("r-swap").onclick = () => { const a = $("r-from").value; $("r-from").value = $("r-to").value; $("r-to").value = a; render(); };
$("r-clear").onclick = () => { $("r-from").value = $("r-to").value = $("r-vehicle").value = ""; render(); };
$("refresh").onclick = load;

// ---------- add driver ----------
const dlg = $("dlg");
$("add-btn").onclick = () => { $("add-form").reset(); $("a-msg").textContent = ""; dlg.showModal(); };
$("dlg-close").onclick = () => dlg.close();
const normPhone = v => v.replace(/[^\d+]/g, "").replace(/^\+?249/, "0");

async function uploadDoc(file, folder) {
  if (!file || !file.size) return null;
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  const path = `${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || "image/jpeg" });
  if (error) throw new Error("تعذّر رفع الصورة: " + error.message);
  return path;
}

$("add-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f);
  const missing = [...f.querySelectorAll("[required]")].filter(el => !el.value.trim());
  if (!fd.get("vehicle_type")) { $("a-msg").textContent = "اختر نوع المركبة"; return; }
  if (missing.length) { $("a-msg").textContent = "عبّي كل الحقول المطلوبة (*)"; missing[0].focus(); return; }
  if (!/^0\d{9}$/.test(normPhone(fd.get("phone")))) { $("a-msg").textContent = "رقم الهاتف لازم يكون 10 أرقام يبدأ بـ 0"; return; }
  $("a-save").disabled = true; $("a-msg").textContent = "";
  const txt = k => (fd.get(k) || "").toString().trim() || null;
  const num = k => fd.get(k) ? Number(fd.get(k)) : null;
  try {
    const [vehicle_photo_path, license_photo_path] = await Promise.all([
      uploadDoc(fd.get("vehicle_photo"), "manual/vehicles"),
      uploadDoc(fd.get("license_photo"), "manual/licenses"),
    ]);
    const row = {
      status: txt("status"), branch: txt("branch"),
      full_name: txt("full_name"), phone: normPhone(fd.get("phone")),
      whatsapp: txt("whatsapp") ? normPhone(fd.get("whatsapp")) : null,
      residence_city: txt("residence_city"), residence_area: txt("residence_area"),
      license_type: txt("license_type"), experience_years: num("experience_years"),
      vehicle_type: txt("vehicle_type"), vehicle_model: txt("vehicle_model"), vehicle_year: num("vehicle_year"),
      capacity_tons: num("capacity_tons"), cover_type: txt("cover_type"), plate_number: txt("plate_number"),
      ownership: txt("ownership"), work_scope: txt("work_scope"),
      route_from: txt("route_from"), route_to: txt("route_to"), other_routes: txt("other_routes"),
      cities: fd.getAll("cities"), availability: txt("availability"),
      pricing_method: txt("pricing_method"), approx_price: num("approx_price"),
      admin_notes: txt("admin_notes"), vehicle_photo_path, license_photo_path,
    };
    const { data, error } = await sb.from(TABLE).insert(row).select().single();
    if (error) throw error;
    rows.unshift(data);
    dlg.close();
    if (data.status === "مقبول" && tab !== "approved") document.querySelector('[data-tab="approved"]').click(); else render();
  } catch (err) {
    $("a-msg").textContent = "تعذّر الحفظ: " + (err.message || err);
  } finally { $("a-save").disabled = false; }
});

// ---------- export ----------
$("export").onclick = () => {
  const cols = [
    ["created_at","تاريخ التسجيل"],["status","الحالة"],["full_name","الاسم"],["phone","الهاتف"],["whatsapp","واتساب"],
    ["residence_city","مدينة الإقامة"],["residence_area","الحي"],["license_type","الرخصة"],["experience_years","سنوات الخبرة"],
    ["vehicle_type","نوع المركبة"],["vehicle_model","الموديل"],["vehicle_year","سنة الصنع"],["capacity_tons","الحمولة (طن)"],
    ["cover_type","التغطية"],["plate_number","اللوحة"],["ownership","الملكية"],["work_scope","نطاق العمل"],
    ["route_from","الخط من"],["route_to","الخط إلى"],["other_routes","خطوط أخرى"],["cities","المدن"],["availability","الأيام"],
    ["pricing_method","طريقة الأجرة"],["approx_price","السعر التقريبي"],["notes","ملاحظات السائق"],["admin_notes","ملاحظات الفريق"],
    ["source","المصدر"],["branch","الفرع"],["added_by","أضافه"],["approved_at","تاريخ الاعتماد"],
  ];
  const cell = v => { v = Array.isArray(v) ? v.join("، ") : (v ?? ""); return `"${String(v).replace(/"/g, '""')}"`; };
  const data = listFor().list.map(x => x.r);
  const csv = [cols.map(c => cell(c[1])).join(","), ...data.map(r => cols.map(([k]) => cell(/_at$/.test(k) ? fmtDate(r[k]) : r[k])).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${tab === "approved" ? "سواقين-معتمدين" : "طلبات-انضمام"}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

boot();
</script>
