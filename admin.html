<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>السائقين – وصلت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vehicles.js"></script>
<style>
:root{
  --primary:#0033B4;--primary-d:#00268A;--yellow:#FFC101;
  --text:#212121;--muted:#6B6B6B;--line:#E0E0E0;--bg:#F5F6F8;--field:#EFEFEF;--field-h:#E6E6E6;
  --c-new:#607D8B;--c-contact:#3F51B5;--c-ok:#4CAF50;--c-no:#E91E63;--c-amber:#FFC107;--c-teal:#009688;
  --radius:16px;--shadow:0 1px 3px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:30;height:72px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 1px 0 var(--line)}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--primary)}
.icon-btn:hover{background:#F0F3FB}
.icon-btn svg.i{width:28px;height:28px;stroke-width:2.2}
.appbar .logo{height:48px}
.appbar .sp{flex:1}
.avatar{width:44px;height:44px;border-radius:50%;background:#BDBDBD;display:grid;place-items:center;color:#fff;border:0;cursor:pointer;position:relative}
.avatar svg{width:26px;height:26px;fill:#fff}
.avatar::after{content:"";position:absolute;top:0;left:2px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.menu{position:absolute;top:64px;left:14px;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.16);min-width:220px;padding:8px 0;z-index:40}
.menu .who{padding:8px 16px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);direction:ltr;text-align:right}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 16px;cursor:pointer;text-align:right}
.menu button:hover{background:#F5F5F5}

/* ---------- drawer ---------- */
.layout{display:flex;min-height:calc(100vh - 72px)}
.drawer{width:270px;flex:none;background:#fff;border-left:1px solid var(--line);padding:10px 0;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}
.drawer a{display:flex;align-items:center;gap:16px;padding:13px 24px;color:var(--text);font-size:16px}
.drawer a:hover{background:#F6F7FA}
.drawer a.on{color:var(--primary)}
.drawer a.on svg.i{color:var(--primary)}
.drawer .n{margin-inline-start:auto;background:var(--primary);color:#fff;border-radius:999px;font-size:12px;min-width:26px;text-align:center;padding:1px 8px}
.drawer hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.scrim{display:none}
main{flex:1;min-width:0}
.content{padding:20px;max-width:1200px;margin:0 auto}
.foot{text-align:center;color:var(--muted);font-size:14px;padding:18px 0 26px}

/* ---------- common ---------- */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.card-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;margin:0 0 18px}
.card-title svg.i{width:24px;height:24px}
.card-title .sp{flex:1}
.crumb{background:#F0F1F4;margin:-20px -20px 0;padding:14px 24px;display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:16px}
.crumb a{color:var(--primary)}
.crumb .sep{color:var(--muted);font-size:14px}
.crumb .sp{flex:1}
.pill{display:inline-block;min-width:62px;text-align:center;background:var(--primary);color:#fff;border-radius:999px;padding:5px 18px;font-weight:600}
.chip{display:inline-block;border-radius:999px;padding:3px 16px;color:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.chip.s-new{background:var(--c-new)}.chip.s-contact{background:var(--c-contact)}.chip.s-ok{background:var(--c-ok)}.chip.s-no{background:var(--c-no)}
.chip.match{background:var(--c-amber);color:#212121}
.btn{border:0;border-radius:999px;padding:9px 22px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-d)}
.btn-tonal{background:#E8EDFB;color:var(--primary)}.btn-tonal:hover{background:#DCE3F8}
.btn-ok{background:var(--c-ok);color:#fff}.btn-no{background:#FCE4EC;color:#C2185B}
.btn-ghost{background:#F2F2F2;color:var(--text)}.btn-ghost:hover{background:#E9E9E9}
.btn-wa{background:#E8F5E9;color:#2E7D32}
.btn:disabled{opacity:.55;cursor:default}
.fab{width:64px;height:38px;border-radius:999px;border:0;background:#9DB0E6;color:#fff;display:grid;place-items:center;cursor:pointer}
.fab:hover{background:var(--primary)}
.fab svg.i{stroke-width:2.4}

/* material filled field */
.field{position:relative;background:var(--field);border-radius:12px 12px 0 0;border-bottom:1.5px solid #9E9E9E;transition:background .15s}
.field:hover{background:var(--field-h)}
.field:focus-within{border-bottom:2px solid var(--primary)}
.field label{position:absolute;right:18px;top:8px;font-size:12.5px;color:var(--muted);pointer-events:none}
.field label .req{color:inherit}
.field:focus-within label{color:var(--primary)}
.field input,.field select,.field textarea{width:100%;border:0;background:transparent;outline:none;padding:28px 18px 9px;font-size:16px;appearance:none;-webkit-appearance:none}
.field select{padding-left:44px;cursor:pointer}
.field.sel::after{content:"";position:absolute;left:20px;top:50%;margin-top:-2px;border:6px solid transparent;border-top-color:#757575;pointer-events:none}
.field textarea{resize:vertical;min-height:90px}
.field input[type=tel]{direction:ltr;text-align:right}
.field.inv{border-bottom-color:#D32F2F}.field.inv label{color:#D32F2F}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fields .full{grid-column:1/-1}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
.dash .card{margin:0}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.legend{display:grid;grid-template-columns:repeat(2,auto);gap:10px 34px}
.legend span{display:flex;align-items:center;gap:10px;font-size:16px}
.legend i{width:34px;height:18px;border-radius:6px;display:inline-block}
.list-row{display:flex;align-items:center;gap:14px;padding:13px 0;font-size:17px}
.list-row+.list-row{border-top:0}
.list-row svg.i{color:#616161}
.list-row .sp{flex:1}
.list-row.link{cursor:pointer}

/* ---------- table ---------- */
.table-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.table-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.table-tools .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:999px;padding:0 16px}
.table-tools .search input{border:0;background:none;outline:none;padding:10px 0;width:100%;font-size:15px}
.table-tools select{border:0;background:var(--field);border-radius:999px;padding:9px 16px;font-size:14px;outline:none;cursor:pointer}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:right;font-weight:500;font-size:16px;color:var(--text);padding:18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15.5px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F7F8FA}
td .code{color:var(--primary);font-weight:500;direction:ltr;display:inline-block}
td .sub{display:block;font-size:13.5px;color:var(--muted)}
td .route{white-space:nowrap}
td .route b{color:var(--yellow);margin:0 8px}
.paginator{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:10px 18px;color:var(--text)}
.paginator .sz{display:flex;align-items:center;gap:6px;margin-inline-end:auto}
.paginator select{border:0;background:none;font-size:15px;outline:none}
.paginator button{border:0;background:none;width:40px;height:40px;border-radius:50%;cursor:pointer;color:#424242;display:grid;place-items:center}
.paginator button:disabled{color:#BDBDBD;cursor:default}
.paginator button:not(:disabled):hover{background:#F0F0F0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* route finder */
.finder{display:grid;grid-template-columns:1fr auto 1fr 1fr auto;gap:12px;align-items:center}
.swap{width:46px;height:46px;border-radius:50%;border:0;background:#E8EDFB;color:var(--primary);cursor:pointer;font-size:20px}
.hint{font-size:13.5px;color:var(--muted);margin:12px 0 0}

/* ---------- detail ---------- */
.detail-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.detail-head .vic{width:66px;height:52px;border-radius:14px;background:#EEF2FC;display:grid;place-items:center;color:var(--primary)}
.vic svg{width:48px;height:26px;transform:scaleX(-1)}
.vic .b{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.vic .g{fill:currentColor;opacity:.18}.vic .w{fill:var(--yellow);stroke:currentColor;stroke-width:2}
.detail-head h2{margin:0;font-size:22px;font-weight:700}
.detail-head .code{color:var(--primary);direction:ltr;font-weight:600}
.kv{display:grid;grid-template-columns:150px 1fr;gap:0}
.kv div{padding:11px 0;border-bottom:1px solid #F0F0F0}
.kv div:nth-child(odd){color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid2 .card{margin:0}
.decision{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.saved{color:var(--c-ok);font-size:14px}

/* ---------- form page (like إنشاء شحنة) ---------- */
.formbar{position:sticky;top:0;z-index:35;height:72px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 1px 0 var(--line)}
.formbar .close{color:#616161}
.formbar h1{font-size:22px;font-weight:500;margin:0}
.formbar .sp{flex:1}
.savegrp{display:flex;align-items:stretch;background:#E0E0E0;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.18);overflow:hidden}
.savegrp button{border:0;background:none;padding:10px 20px;display:flex;gap:8px;align-items:center;cursor:pointer;color:#424242;font-size:17px}
.savegrp.ready{background:var(--primary)}
.savegrp.ready button{color:#fff}
.savegrp button:disabled{cursor:wait;opacity:.7}
.form-page{max-width:900px;margin:0 auto;padding:20px}
.vehicles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vcard{position:relative;display:block}
.vcard input{position:absolute;opacity:0;pointer-events:none}
.vbox{display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 6px 9px;border-radius:12px;background:var(--field);cursor:pointer;text-align:center;height:100%;border:2px solid transparent}
.vbox svg{width:56px;height:28px;margin-bottom:5px;transform:scaleX(-1);color:#8A8A8A}
.vbox .b{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.vbox .g{fill:currentColor;opacity:.18}.vbox .w{fill:#fff;stroke:currentColor;stroke-width:2}
.vbox b{font-size:14px;font-weight:600}.vbox small{font-size:11.5px;color:var(--muted)}
.vcard input:checked+.vbox{border-color:var(--primary);background:#EEF2FC}
.vcard input:checked+.vbox svg{color:var(--primary)}
.vcard input:checked+.vbox .w{fill:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ck{position:relative}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck span{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--field);cursor:pointer;font-size:14.5px}
.ck input:checked+span{background:var(--primary);color:#fff}
.sublabel{font-size:13px;color:var(--muted);margin:0 4px 8px}
.formmsg{color:#D32F2F;font-size:14.5px;margin:0 0 10px}
.filebox{background:var(--field);border-radius:12px 12px 0 0;border-bottom:1.5px solid #9E9E9E;padding:10px 18px}
.filebox label{display:block;font-size:12.5px;color:var(--muted)}
.filebox input{font-size:14px;margin-top:4px;width:100%}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px;text-align:center;padding:32px 28px}
.login img{height:60px;margin-bottom:12px}
.login h1{font-size:20px;margin:0 0 20px;font-weight:600}
.login .field{margin-bottom:14px;text-align:right}
.login .err{color:#D32F2F;min-height:22px;font-size:14px;margin-top:8px}

.viewer{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:80;padding:20px}
.viewer img{max-width:100%;max-height:86vh;border-radius:12px;background:#fff}
.viewer button{position:absolute;top:16px;left:16px}

@media (max-width:900px){
  .drawer{position:fixed;top:0;right:0;height:100vh;z-index:50;transform:translateX(100%);transition:transform .2s;padding-top:20px;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
  .drawer.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
  .dash,.grid2{grid-template-columns:1fr}
  .content{padding:14px}
  .crumb{margin:-14px -14px 14px}
  .fields{grid-template-columns:1fr}
  .vehicles{grid-template-columns:repeat(2,1fr)}
  .finder{grid-template-columns:1fr auto 1fr}
  .finder>:nth-child(4),.finder>:nth-child(5){grid-column:1/-1}
  .appbar .logo{height:40px}
  .kv{grid-template-columns:120px 1fr}
}
@media (min-width:901px){ #menu-btn{display:none} }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="login" id="login" hidden>
  <form class="card" id="login-form">
    <img src="logo-h.png" alt="وصلت">
    <h1>تسجيل الدخول – السائقين</h1>
    <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required autocomplete="username" dir="ltr"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" id="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary" style="width:100%;padding:12px" id="login-btn">دخول</button>
    <div class="err" id="login-err"></div>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="appbar" id="appbar">
    <button class="icon-btn" id="menu-btn" aria-label="القائمة"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <img class="logo" src="logo-h.png" alt="وصلت">
    <span class="sp"></span>
    <button class="avatar" id="avatar" aria-label="الحساب"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/></svg></button>
    <div class="menu" id="menu" hidden>
      <div class="who" id="who"></div>
      <button id="logout"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>تسجيل الخروج</button>
    </div>
  </header>

  <div class="layout">
    <nav class="drawer" id="drawer">
      <a href="#/dashboard" data-nav="dashboard"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13l3-3M8 13h.01M16 13h.01M12 9h.01"/></svg>لوحة التحكم</a>
      <a href="#/requests" data-nav="requests"><svg class="i" viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4M5 13l2-7h10l2 7v6H5z"/></svg>طلبات الانضمام<span class="n" id="nav-req">0</span></a>
      <a href="#/approved" data-nav="approved"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M16 11l2 2 4-4"/></svg>السائقين المعتمدين<span class="n" id="nav-app">0</span></a>
      <a href="#/add" data-nav="add"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M19 8v6M16 11h6"/></svg>إضافة سائق</a>
      <hr>
      <a href="./" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>فورم التسجيل</a>
    </nav>
    <div class="scrim" id="scrim" hidden></div>

    <main>
      <div class="content" id="view"></div>
      <div class="foot">© ٢٠٢٦ وصلت <span style="color:#9E9E9E">· السائقين</span></div>
    </main>
  </div>
</div>

<!-- ============ ADD DRIVER PAGE ============ -->
<div id="addpage" hidden>
  <header class="formbar">
    <a class="icon-btn close" href="#/approved" aria-label="إغلاق"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1>إضافة سائق</h1>
    <span class="sp"></span>
    <div class="savegrp" id="savegrp"><button type="submit" form="add-form" id="a-save"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>حفظ</button></div>
  </header>
  <form class="form-page" id="add-form" novalidate>
    <p class="formmsg" id="a-msg"></p>

    <section class="card">
      <h3 class="card-title">بيانات التسجيل</h3>
      <div class="fields">
        <div class="field sel"><label>الفرع *</label><select name="branch" id="a-branch" required></select></div>
        <div class="field sel"><label>الحالة *</label><select name="status"><option>مقبول</option><option>جديد</option><option>تم التواصل</option></select></div>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">بيانات السائق</h3>
      <div class="fields">
        <div class="field full"><label>الاسم الكامل *</label><input type="text" name="full_name" required></div>
        <div class="field"><label>الموبايل *</label><input type="tel" name="phone" required placeholder="0912345678"></div>
        <div class="field"><label>الواتساب</label><input type="tel" name="whatsapp"></div>
        <div class="field sel"><label>مدينة الإقامة *</label><select name="residence_city" data-cities required><option value=""></option></select></div>
        <div class="field"><label>المنطقة / الحي *</label><input type="text" name="residence_area" required></div>
        <div class="field sel"><label>نوع الرخصة *</label><select name="license_type" required><option value=""></option><option>خاصة</option><option>عامة</option><option>نقل ثقيل</option></select></div>
        <div class="field"><label>سنوات الخبرة</label><input type="number" name="experience_years" min="0"></div>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">بيانات المركبة</h3>
      <p class="sublabel">نوع المركبة *</p>
      <div class="vehicles" id="a-vehicles"></div>
      <div class="fields" style="margin-top:18px">
        <div class="field"><label>الماركة والموديل *</label><input type="text" name="vehicle_model" required></div>
        <div class="field"><label>سنة الصنع</label><input type="number" name="vehicle_year" min="1970" max="2027"></div>
        <div class="field"><label>الحمولة (طن) *</label><input type="number" name="capacity_tons" step="0.1" min="0.1" required></div>
        <div class="field"><label>رقم اللوحة *</label><input type="text" name="plate_number" required></div>
        <div class="field sel"><label>التغطية *</label><select name="cover_type" required><option value=""></option><option>مغلقة</option><option>مغطاة بمشمع</option><option>مكشوفة</option></select></div>
        <div class="field sel"><label>الملكية *</label><select name="ownership" required><option value=""></option><option>ملك للسائق</option><option>ملك لشخص آخر</option></select></div>
        <div class="filebox"><label>صورة المركبة</label><input type="file" name="vehicle_photo" accept="image/*"></div>
        <div class="filebox"><label>صورة الرخصة</label><input type="file" name="license_photo" accept="image/*"></div>
      </div>
    </section>

    <section class="card">

// ---------- dashboard ----------
function donut(parts, total) {
  const R = 70, C = 2 * Math.PI * R; let off = 0;
  const segs = parts.filter(p => p.n > 0).map(p => {
    const len = C * p.n / total, gap = parts.filter(x => x.n > 0).length > 1 ? 4 : 0;
    const s = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${p.color}" stroke-width="30" stroke-dasharray="${Math.max(len - gap, 0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;
    off += len; return s;
  }).join("");
  return `<svg viewBox="0 0 200 200" width="230" height="230" role="img" aria-label="توزيع السائقين حسب الحالة">
    ${total ? segs : `<circle r="${R}" cx="100" cy="100" fill="none" stroke="#EEE" stroke-width="30"/>`}

    <text x="100" y="126" text-anchor="middle" font-size="20" fill="#212121">الإجمالي</text></svg>`;
}

// ---------- tables ----------
function table(list, withMatch) {
  if (!list.length) return `<div class="empty">لا توجد نتائج</div>`;
  return `<table><thead><tr>
    <th>الكود</th><th>التاريخ</th><th>السائق</th><th>المركبة</th><th>الخط</th><th>الحالة</th>${withMatch ? "<th>المطابقة</th>" : ""}
  </tr></thead><tbody>${list.map(x => {
    const r = x.r || x, m = x.m;
    return `<tr data-id="${r.id}">
      <td><span class="code">${code(r)}</span></td>
      <td>${fmtDate(r.created_at)}<span class="sub">${fmtTime(r.created_at)}</span></td>
      <td>${esc(r.full_name)}<span class="sub" dir="ltr" style="text-align:right">${esc(r.phone)}</span></td>
      <td>${esc(r.vehicle_type)}<span class="sub">${esc(r.capacity_tons)} طن · ${esc(r.cover_type)}</span></td>
      <td class="route">${esc(r.route_from)}<b>←</b>${esc(r.route_to)}</td>
      <td>${chip(r.status)}</td>
      ${withMatch ? `<td>${m && m.label ? `<span class="chip match">${esc(m.label)}</span>` : "—"}</td>` : ""}
    </tr>`;
  }).join("")}</tbody></table>`;
}
function bindRows() { $("view").querySelectorAll("tbody tr[data-id]").forEach(tr => tr.onclick = () => location.hash = "#/driver/" + tr.dataset.id); }

function routeMatch(r, from, to) {
  if (!from && !to) return { score: 1, label: "" };
  const f = norm(from), t = norm(to), rf = norm(r.route_from), rt = norm(r.route_to);
  const other = norm(r.other_routes);
  const segs = String(r.other_routes || "").split(/[،,؛;\n\/]|\sو\s/).map(norm).filter(Boolean);
  const covered = new Set([rf, rt, norm(r.residence_city), ...(r.cities || []).map(norm)]);
  if (f && t) {
    if ((rf === f && rt === t) || (rf === t && rt === f)) return { score: 3, label: "نفس الخط" };
    if (segs.some(s => s.includes(f) && s.includes(t))) return { score: 2, label: "خط إضافي" };
    if ((covered.has(f) || other.includes(f)) && (covered.has(t) || other.includes(t))) return { score: 1, label: "يغطي المدينتين" };
    return { score: 0 };
  }
  const c = f || t;
  if (rf === c || rt === c) return { score: 3, label: "على الخط" };
  if (other.includes(c)) return { score: 2, label: "خط إضافي" };
  if (covered.has(c)) return { score: 1, label: "يغطي المدينة" };
  return { score: 0 };
}

function filtered(kind) {
  const s = state[kind];
  const q = s.q.trim().toLowerCase();
  let list = rows.filter(r => (kind === "approved") === (r.status === "مقبول"))
    .filter(r => !s.vehicle || r.vehicle_type === s.vehicle)
    .filter(r => !q || [r.full_name, r.phone, r.whatsapp, r.plate_number, code(r)].some(v => String(v || "").toLowerCase().includes(q)));
  if (kind === "requests") return list.filter(r => !s.status || r.status === s.status).map(r => ({ r }));
  return list.map(r => ({ r, m: routeMatch(r, s.from, s.to) })).filter(x => x.m.score > 0).sort((a, b) => b.m.score - a.m.score);
}

const opts = (arr, sel, first) => `<option value="">${first}</option>` + arr.map(v => `<option ${v === sel ? "selected" : ""}>${esc(v)}</option>`).join("");

function viewList(kind) {
  const s = state[kind];
  const isApp = kind === "approved";
  const vehicles = [...new Set([...VEHICLES.map(v => v.v), ...rows.map(r => r.vehicle_type)].filter(Boolean))];
  $("view").innerHTML = `
    ${crumb(isApp ? "السائقين المعتمدين" : "طلبات الانضمام", `<button class="icon-btn" style="color:#616161" id="export" title="تصدير Excel" aria-label="تصدير">${ICON.dots}</button>`)}
    ${isApp ? `<section class="card">
      <h3 class="card-title">${ICON.route}ابحث عن سائق لخط معيّن</h3>
      <div class="finder">
        <div class="field sel"><label>من</label><select id="r-from">${opts(CITIES, s.from, "أي مدينة")}</select></div>
        <button class="swap" id="r-swap" aria-label="عكس الاتجاه">⇄</button>
        <div class="field sel"><label>إلى</label><select id="r-to">${opts(CITIES, s.to, "أي مدينة")}</select></div>
        <div class="field sel"><label>نوع المركبة</label><select id="r-vehicle">${opts(vehicles, s.vehicle, "الكل")}</select></div>
        <button class="btn btn-ghost" id="r-clear">مسح</button>
      </div>
      <p class="hint">الترتيب: نفس الخط أولاً، بعده الخط الإضافي، بعده السائقين البيغطوا المدينتين.</p>
    </section>` : ""}
    <div style="display:flex;justify-content:flex-start;margin:0 0 14px"><a class="fab" href="#/add" aria-label="إضافة سائق" title="إضافة سائق">${ICON.plus}</a></div>
    <section class="table-card">
      <div class="table-tools">
        <div class="search">${ICON.search}<input id="q" placeholder="بحث بالاسم أو الموبايل أو اللوحة أو الكود" value="${esc(s.q)}"></div>
        ${isApp ? "" : `<select id="f-status">${opts(REQ, s.status, "كل الحالات")}</select><select id="f-vehicle">${opts(vehicles, s.vehicle, "كل المركبات")}</select>`}
      </div>
      <div class="tscroll" id="tbl"></div>
      <div class="paginator" id="pg"></div>
    </section>`;
  const draw = () => {
    const list = filtered(kind);
    const pages = Math.max(1, Math.ceil(list.length / s.size));
    s.page = Math.min(s.page, pages - 1);
    const slice = list.slice(s.page * s.size, (s.page + 1) * s.size);
    $("tbl").innerHTML = table(slice, isApp && (s.from || s.to));
    if (isApp && (s.from || s.to) && !list.length) $("tbl").innerHTML = `<div class="empty">ما في سائق معتمد على الخط ده حالياً</div>`;
    const a = list.length ? s.page * s.size + 1 : 0, b = Math.min(list.length, (s.page + 1) * s.size);
    $("pg").innerHTML = `
      <span class="sz"><select id="pg-size">${[10, 20, 50, 100].map(n => `<option ${n === s.size ? "selected" : ""}>${n}</option>`).join("")}</select></span>
      <span>${a}-${b} من ${list.length}</span>
      <button data-p="first" ${s.page === 0 ? "disabled" : ""} aria-label="الأولى">⇥</button>
      <button data-p="prev" ${s.page === 0 ? "disabled" : ""} aria-label="السابقة">›</button>
      <button data-p="next" ${s.page >= pages - 1 ? "disabled" : ""} aria-label="التالية">‹</button>
      <button data-p="last" ${s.page >= pages - 1 ? "disabled" : ""} aria-label="الأخيرة">⇤</button>`;
    $("pg-size").onchange = e => { s.size = +e.target.value; s.page = 0; draw(); };
    $("pg").querySelectorAll("[data-p]").forEach(btn => btn.onclick = () => {
      s.page = { first: 0, prev: s.page - 1, next: s.page + 1, last: pages - 1 }[btn.dataset.p]; draw();
    });
    bindRows();
    $("export").onclick = () => exportCsv(list.map(x => x.r), isApp ? "سائقين-معتمدين" : "طلبات-انضمام");
  };
  $("q").oninput = e => { s.q = e.target.value; s.page = 0; draw(); };
  if (isApp) {
    $("r-from").onchange = e => { s.from = e.target.value; s.page = 0; draw(); };
    $("r-to").onchange = e => { s.to = e.target.value; s.page = 0; draw(); };
    $("r-vehicle").onchange = e => { s.vehicle = e.target.value; s.page = 0; draw(); };
    $("r-swap").onclick = () => { [s.from, s.to] = [s.to, s.from]; $("r-from").value = s.from; $("r-to").value = s.to; draw(); };
    $("r-clear").onclick = () => { s.from = s.to = s.vehicle = ""; viewList(kind); };
  } else {
    $("f-status").onchange = e => { s.status = e.target.value; s.page = 0; draw(); };
    $("f-vehicle").onchange = e => { s.vehicle = e.target.value; s.page = 0; draw(); };
  }
  draw();
}

// ---------- driver detail ----------
function viewDriver(id) {

  const kv = pairs => `<div class="kv">${pairs.filter(p => p[1] !== null && p[1] !== undefined && p[1] !== "").map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join("")}</div>`;
  $("view").innerHTML = `
    <div class="crumb"><a href="#/dashboard">الرئيسية</a><span class="sep">«</span><a href="${back[0]}">${back[1]}</a><span class="sep">«</span><span dir="ltr">${code(r)}</span></div>
    <section class="card">
      <div class="detail-head">
        <div class="vic"><svg viewBox="0 0 64 32">${vehicleIcon(r.vehicle_type)}</svg></div>

          <h2>${esc(r.full_name)}</h2>
          <div><span class="code">${code(r)}</span> · ${esc(r.vehicle_type)} · ${esc(r.route_from)} ← ${esc(r.route_to)}</div>
        </div>
        ${chip(r.status)}
      </div>
      <div class="actions" style="margin-top:18px">
        <a class="btn btn-tonal" href="tel:${esc(r.phone)}">${ICON.phone}اتصال</a>
        <a class="btn btn-wa" href="https://wa.me/${waNum(r.whatsapp || r.phone)}" target="_blank" rel="noopener">واتساب</a>
        ${r.vehicle_photo_path ? `<button class="btn btn-ghost" data-photo="${esc(r.vehicle_photo_path)}">${ICON.img}صورة المركبة</button>` : ""}
        ${r.license_photo_path ? `<button class="btn btn-ghost" data-photo="${esc(r.license_photo_path)}">${ICON.img}صورة الرخصة</button>` : ""}
        ${!r.vehicle_photo_path && !r.license_photo_path ? `<span class="hint" style="margin:8px 0 0">لم تُرفع صور</span>` : ""}
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">${ICON.clock}القرار</h3>
      <div class="decision">
        ${approved ? "" : `<button class="btn btn-ok" data-set="مقبول">قبول واعتماد</button>${r.status !== "مرفوض" ? `<button class="btn btn-no" data-set="مرفوض">رفض</button>` : ""}`}
        <div class="field sel" style="min-width:200px"><label>الحالة</label><select id="d-status">${Object.keys(STATUS).map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>
        <span class="saved" id="d-saved" hidden>تم الحفظ</span>
      </div>
      <div class="field" style="margin-top:16px"><label>ملاحظات الفريق</label><textarea id="d-notes">${esc(r.admin_notes)}</textarea></div>
      <p class="hint">${approved && r.approved_at ? `اعتُمد ${fmtDate(r.approved_at)} ${fmtTime(r.approved_at)}${r.approved_by ? " بواسطة " + esc(r.approved_by) : ""} · ` : ""}سُجّل ${fmtDate(r.created_at)} ${fmtTime(r.created_at)}${r.source === "manual" ? ` · أُضيف يدوياً${r.branch ? " من فرع " + esc(r.branch) : ""}${r.added_by ? " بواسطة " + esc(r.added_by) : ""}` : " · من فورم التسجيل"}</p>
    </section>

    <div class="grid2">
      <section class="card"><h3 class="card-title">${ICON.user}بيانات السائق</h3>${kv([
        ["الموبايل", `<span dir="ltr">${esc(r.phone)}</span>`],
        ["الواتساب", r.whatsapp ? `<span dir="ltr">${esc(r.whatsapp)}</span>` : null],
        ["الإقامة", `${esc(r.residence_city)} – ${esc(r.residence_area)}`],
        ["الرخصة", esc(r.license_type)],
        ["الخبرة", r.experience_years != null ? esc(r.experience_years) + " سنة" : null],
      ])}</section>
      <section class="card"><h3 class="card-title">${ICON.truck}بيانات المركبة</h3>${kv([
        ["النوع", esc(r.vehicle_type)],
        ["الماركة والموديل", esc(r.vehicle_model) + (r.vehicle_year ? " · " + esc(r.vehicle_year) : "")],
        ["الحمولة", esc(r.capacity_tons) + " طن"],
        ["التغطية", esc(r.cover_type)],
        ["رقم اللوحة", esc(r.plate_number)],
        ["الملكية", esc(r.ownership)],
      ])}</section>
    </div>
    <section class="card" style="margin-top:20px"><h3 class="card-title">${ICON.route}الخط والأجرة</h3>${kv([
      ["الخط الأساسي", `${esc(r.route_from)} ← ${esc(r.route_to)}`],
      ["خطوط أخرى", r.other_routes ? esc(r.other_routes) : null],
      ["المدن", (r.cities || []).length ? r.cities.map(esc).join("، ") : null],
      ["نطاق العمل", esc(r.work_scope)],
      ["طريقة الأجرة", esc(r.pricing_method)],
      ["السعر التقريبي", r.approx_price ? money(r.approx_price) + " جنيه سوداني" : "غير محدد"],
      ["الأيام", r.availability ? esc(r.availability) : null],
      ["عمل مع شركات", r.worked_with_companies ? esc(r.worked_with_companies) : null],
      ["ملاحظة السائق", r.notes ? esc(r.notes) : null],
    ])}</section>`;

  const flash = () => { $("d-saved").hidden = false; setTimeout(() => $("d-saved") && ($("d-saved").hidden = true), 1500); };
  $("view").querySelectorAll("[data-set]").forEach(b => b.onclick = async () => {
    if (b.dataset.set === "مرفوض" && !confirm("رفض هذا الطلب؟")) return;
    b.disabled = true;
    if (await save(r.id, { status: b.dataset.set })) viewDriver(r.id); else b.disabled = false;
  });
  $("d-status").onchange = async e => { if (await save(r.id, { status: e.target.value })) viewDriver(r.id); };
  $("d-notes").onchange = async e => { if (await save(r.id, { admin_notes: e.target.value.trim() || null })) flash(); };
  $("view").querySelectorAll("[data-photo]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(b.dataset.photo, 600);
    b.disabled = false;
    if (error) return alert("تعذّر فتح الصورة");
    $("viewer-img").src = data.signedUrl; $("viewer").hidden = false;
  });
}
$("viewer-close").onclick = () => { $("viewer").hidden = true; $("viewer-img").src = ""; };
$("viewer").onclick = e => { if (e.target.id === "viewer") $("viewer-close").onclick(); };

async function save(id, patch) {
  const { data, error } = await sb.from(TABLE).update(patch).eq("id", id).select().single();
  if (error) { alert("تعذّر الحفظ: " + error.message); return false; }
  Object.assign(rows.find(r => r.id === id), data || patch);
  updateNav();
  return true;
}

// ---------- add driver ----------
const fillSel = (sel, arr) => arr.forEach(v => sel.add(new Option(v, v)));
document.querySelectorAll("#add-form select[data-cities]").forEach(s => fillSel(s, CITIES));
$("a-branch").innerHTML = BRANCHES.map(b => `<option>${b}</option>`).join("");
$("a-vehicles").innerHTML = VEHICLES.map(x => vehicleCard("vehicle_type", x)).join("");
$("a-cities").innerHTML = CITIES.map(c => `<label class="ck"><input type="checkbox" name="cities" value="${c}"><span>${c}</span></label>`).join("");
function openAdd() {
  $("add-form").reset(); $("a-msg").textContent = "";
  document.querySelectorAll("#add-form .inv").forEach(f => f.classList.remove("inv"));
  $("savegrp").classList.remove("ready");
}
$("add-form").addEventListener("input", () => {
  const f = $("add-form");
  const ok = [...f.querySelectorAll("[required]")].every(el => el.value.trim()) && new FormData(f).get("vehicle_type");
  $("savegrp").classList.toggle("ready", !!ok);
});
async function uploadDoc(file, folder) {
  if (!file || !file.size) return null;
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  const path = `${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || "image/jpeg" });
  if (error) throw new Error("تعذّر رفع الصورة: " + error.message);
  return path;
}
$("add-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f);
  f.querySelectorAll(".inv").forEach(x => x.classList.remove("inv"));
  const missing = [...f.querySelectorAll("[required]")].filter(el => !el.value.trim());
  missing.forEach(el => el.closest(".field")?.classList.add("inv"));
  if (!fd.get("vehicle_type")) { $("a-msg").textContent = "اختر نوع المركبة"; window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (missing.length) { $("a-msg").textContent = "عبّي كل الحقول المطلوبة (*)"; missing[0].focus(); return; }
  if (!/^0\d{9}$/.test(normPhone(fd.get("phone")))) { $("a-msg").textContent = "رقم الموبايل لازم يكون 10 أرقام يبدأ بـ 0"; return; }
  $("a-save").disabled = true; $("a-msg").textContent = "";
  const txt = k => (fd.get(k) || "").toString().trim() || null;
  const num = k => fd.get(k) ? Number(fd.get(k)) : null;
  try {
    const [vehicle_photo_path, license_photo_path] = await Promise.all([
      uploadDoc(fd.get("vehicle_photo"), "manual/vehicles"), uploadDoc(fd.get("license_photo"), "manual/licenses")]);
    const row = {
      status: txt("status"), branch: txt("branch"), full_name: txt("full_name"), phone: normPhone(fd.get("phone")),
      whatsapp: txt("whatsapp") ? normPhone(fd.get("whatsapp")) : null,
      residence_city: txt("residence_city"), residence_area: txt("residence_area"),
      license_type: txt("license_type"), experience_years: num("experience_years"),
      vehicle_type: txt("vehicle_type"), vehicle_model: txt("vehicle_model"), vehicle_year: num("vehicle_year"),
      capacity_tons: num("capacity_tons"), cover_type: txt("cover_type"), plate_number: txt("plate_number"),
      ownership: txt("ownership"), work_scope: txt("work_scope"), route_from: txt("route_from"), route_to: txt("route_to"),
      other_routes: txt("other_routes"), cities: fd.getAll("cities"), availability: txt("availability"),
      pricing_method: txt("pricing_method"), approx_price: num("approx_price"), admin_notes: txt("admin_notes"),
      vehicle_photo_path, license_photo_path,
    };
    const { data, error } = await sb.from(TABLE).insert(row).select().single();
    if (error) throw error;
    rows.unshift(data); updateNav();
    location.hash = "#/driver/" + data.id;
  } catch (err) {
    $("a-msg").textContent = "تعذّر الحفظ: " + (err.message || err);
    window.scrollTo({ top: 0, behavior: "smooth" });
  } finally { $("a-save").disabled = false; }
});

// ---------- export ----------
function exportCsv(data, name) {
  const cols = [["code","الكود"],["created_at","تاريخ التسجيل"],["status","الحالة"],["full_name","الاسم"],["phone","الموبايل"],["whatsapp","واتساب"],
    ["residence_city","مدينة الإقامة"],["residence_area","الحي"],["license_type","الرخصة"],["experience_years","الخبرة"],
    ["vehicle_type","نوع المركبة"],["vehicle_model","الموديل"],["vehicle_year","سنة الصنع"],["capacity_tons","الحمولة (طن)"],
    ["cover_type","التغطية"],["plate_number","اللوحة"],["ownership","الملكية"],["work_scope","نطاق العمل"],
    ["route_from","الخط من"],["route_to","الخط إلى"],["other_routes","خطوط أخرى"],["cities","المدن"],["availability","الأيام"],
    ["pricing_method","طريقة الأجرة"],["approx_price","السعر التقريبي"],["notes","ملاحظات السائق"],["admin_notes","ملاحظات الفريق"],
    ["source","المصدر"],["branch","الفرع"],["added_by","أضافه"],["approved_at","تاريخ الاعتماد"]];
  const cell = v => { v = Array.isArray(v) ? v.join("، ") : (v ?? ""); return `"${String(v).replace(/"/g, '""')}"`; };
  const val = (r, k) => k === "code" ? code(r) : /_at$/.test(k) ? (r[k] ? fmtDate(r[k]) + " " + fmtTime(r[k]) : "") : r[k];
  const csv = [cols.map(c => cell(c[1])).join(","), ...data.map(r => cols.map(([k]) => cell(val(r, k))).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${name}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

boot();
</script>
